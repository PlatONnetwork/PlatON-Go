name: golangci-lint
on:
  pull_request:
    branches: '**'
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.22
        id: go

      - uses: actions/checkout@v4

      - name: make
        run: bash ./build/build_deps.sh

      - name: Get dependencies
        run : |
          go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: 'latest'
          args: --config=.golangci.yml
